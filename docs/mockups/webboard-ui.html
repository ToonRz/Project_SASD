<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webboard UI Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:ital,wght@1,600;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Webboard — UI mock (Presentation Layer, ยังไม่ implement)
  ไฟล์เดียว เปิดใน browser ได้เลย ข้อมูลและ API ทั้งหมดจำลองอยู่ใน <script> ด้านล่าง
  ทิศทางภาพ: อ้างอิงโทน Dribbble "Bank App - Account Balance Overview" (Ronas IT) —
  พื้นดำ/ขาวนวล, สีมะนาว + ม่วงลาเวนเดอร์, หัวข้อหนา, การ์ดโค้งมน, สติกเกอร์เอียง
  ครอบคลุม FR-TOPIC/COMMENT/REPLY/TAG/ROOM + flow บัญชีที่ยังเป็น Non-Goal ใน SPEC:
  สมัคร → ยืนยันอีเมล → ตั้ง 2FA, เข้าสู่ระบบ (+2FA), ลืม/รีเซ็ตรหัสผ่าน, โปรไฟล์, อัปโหลดรูป
  ปุ่ม "MOCK" มุมจอ: สลับหน้าจอ สถานะ API และดูบัญชีทดสอบ
-->
<style>
:root{
  --f-display:"Kanit",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
  --f-hand:"Mali","Kanit",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --ease-spring:cubic-bezier(.34,1.45,.64,1);
  --d1:150ms; --d2:240ms; --d3:420ms;
  --top-h:72px;

  --c-lime:#d4f25a; --c-purple:#b796ff; --c-pink:#ff9fd6; --c-orange:#ffb460; --c-blue:#92cbff; --c-mint:#86e6c4;
  --c-purple-ink:#7a4ff0;
  --black:#111111;
  --nav-w:272px;
  --page:#ffffff; --side:#f3f3ef; --raise:#ffffff;

  --bg:#ebebe6;
  --card:#ffffff;
  --card-2:#f4f4f0;
  --ink:#111111;
  --ink-2:#4b4b46;
  --ink-3:#8a8a83;
  --line:#e3e3dd;
  --line-2:#cdcdc5;
  --hero:#111111;
  --hero-ink:#ffffff;
  --primary:#111111; --primary-ink:#ffffff; --primary-hover:#2c2c2c;
  --danger:#e0484d; --danger-soft:#fde9e8; --ok:#1f9d55; --warn:#d98a1c;
  --overlay:rgba(12,12,10,.45);
  --elev:0 1px 2px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b; --card:#171717; --card-2:#1f1f1f; --ink:#f2f2ec; --ink-2:#bdbdb5; --ink-3:#7d7d77;
    --line:#252525; --line-2:#353535; --hero:#171717; --hero-ink:#f2f2ec;
    --page:#0b0b0b; --side:#161616; --raise:#232323;
    --primary:#d4f25a; --primary-ink:#111111; --primary-hover:#e3fb84;
    --danger:#ff7a76; --danger-soft:#3a1a19; --ok:#5fd394; --overlay:rgba(0,0,0,.65);
    --elev:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --card:#171717; --card-2:#1f1f1f; --ink:#f2f2ec; --ink-2:#bdbdb5; --ink-3:#7d7d77;
  --line:#252525; --line-2:#353535; --hero:#171717; --hero-ink:#f2f2ec;
  --page:#0b0b0b; --side:#161616; --raise:#232323;
  --primary:#d4f25a; --primary-ink:#111111; --primary-hover:#e3fb84;
  --danger:#ff7a76; --danger-soft:#3a1a19; --ok:#5fd394; --overlay:rgba(0,0,0,.65);
  --elev:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--f-body);-webkit-font-smoothing:antialiased;transition:background-color var(--d3) var(--ease-out),color var(--d3) var(--ease-out)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.display{font-family:var(--f-display);letter-spacing:-.015em}
.hand{font-family:var(--f-hand);font-style:italic;font-weight:700;color:var(--c-purple-ink);letter-spacing:0}
.hero .hand,.auth-art .hand{color:var(--c-purple)}
.muted{color:var(--ink-3)}

/* ---------- Buttons: flat fills, no glow ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:1px solid transparent;
  font:600 15px/1 var(--f-display);letter-spacing:.005em;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;
  transition:background-color var(--d1) var(--ease-out),border-color var(--d1) var(--ease-out),color var(--d1) var(--ease-out),transform var(--d2) var(--ease-out);
}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{cursor:not-allowed;opacity:.45}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-lime{background:var(--c-lime);color:#111}
.btn-lime:hover:not(:disabled){background:#e0fa78}
.btn-white{background:var(--card);border-color:var(--line-2);color:var(--ink)}
.btn-white:hover:not(:disabled){border-color:var(--ink-3)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover:not(:disabled){background:var(--card-2);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){filter:brightness(.92)}
.btn-sm{height:36px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
.btn.busy{pointer-events:none}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);transition:background-color var(--d1),color var(--d1),transform var(--d2) var(--ease-out)}
.icon-btn:hover{background:var(--card-2);color:var(--ink)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.solid{background:var(--card);border:1px solid var(--line)}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;transition:text-decoration-color var(--d1);background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
.link:hover{text-decoration-color:var(--ink)}
.link-btn{border:0;background:none;padding:5px 10px;margin:0 -4px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-3);transition:color var(--d1),background-color var(--d1)}
.link-btn:hover{color:var(--ink);background:var(--card-2)}

/* ---------- Stickers & doodles ---------- */
.sticker{
  position:absolute;z-index:2;display:inline-block;padding:7px 12px 6px;border-radius:8px;
  background:#111;color:#fff;font:700 13px/1.15 var(--f-display);letter-spacing:.01em;white-space:nowrap;
  transform:rotate(var(--r,-6deg));transition:transform var(--d3) var(--ease-spring);pointer-events:none;
  animation:stickerIn 560ms var(--ease-spring) both;animation-delay:var(--sd,120ms);
}
.sticker.lime{background:var(--c-lime);color:#111}
.sticker.purple{background:var(--c-purple);color:#111}
.sticker.white{background:#fff;color:#111;border:1.5px solid #111}
.sticker.big{font-size:17px;padding:10px 14px 9px;border-radius:10px}
.sticker.ticket{border-radius:4px;-webkit-mask:radial-gradient(circle 5px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;padding-left:16px;padding-right:16px}
@keyframes stickerIn{from{opacity:0;transform:rotate(calc(var(--r,-6deg) - 14deg)) scale(.6)}}
.doodle{position:absolute;pointer-events:none;color:currentColor;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:fadeIn 600ms var(--ease-out) both;animation-delay:240ms}
@keyframes fadeIn{from{opacity:0}}

/* ---------- Progress ---------- */
#progress{position:fixed;inset:0 0 auto 0;height:3px;z-index:90;background:var(--c-purple);transform:scaleX(0);transform-origin:left;opacity:0;pointer-events:none}
#progress.run{opacity:1;transform:scaleX(.72);transition:transform 1.8s cubic-bezier(.1,.7,.2,1),opacity 0s}
#progress.done{opacity:0;transform:scaleX(1);transition:transform 200ms var(--ease-out),opacity 260ms 180ms ease}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--top-h);background:color-mix(in srgb,var(--page) 90%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);box-shadow:0 1px 0 var(--line);transition:background-color var(--d3);view-transition-name:topbar}
body[data-layout="auth"] .topbar{background:color-mix(in srgb,var(--bg) 86%,transparent);box-shadow:none}
.topbar-in{position:relative;height:100%;padding:0 20px 0 14px;display:grid;grid-template-columns:calc(var(--nav-w) - 14px) minmax(0,1fr) auto;gap:16px;align-items:center}
.brand-wrap{display:flex;align-items:center;gap:6px;min-width:0;transition:opacity var(--d2)}
.nav-toggle{display:none}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:700 21px/1 var(--f-display);letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--c-lime);display:grid;place-items:center;transform:rotate(-6deg);transition:transform var(--d3) var(--ease-spring)}
.brand:hover .brand-mark{transform:rotate(4deg) scale(1.05)}
.brand-mark svg{width:20px;height:20px;fill:#111}
.search{position:relative;display:flex;align-items:center;gap:10px;width:100%;max-width:620px;justify-self:center;height:44px;padding:0 10px 0 16px;background:var(--side);border:1px solid transparent;border-radius:999px;color:var(--ink-3);transition:border-color var(--d2),background-color var(--d2),opacity var(--d2),transform var(--d2) var(--ease-out),visibility var(--d2)}
.search:hover{border-color:var(--line-2)}
.search:focus-within{background:var(--page);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:14.5px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search kbd{font:500 11px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:4px 7px;transition:opacity var(--d1)}
.search:focus-within kbd,.search.has-value kbd{opacity:0}
.search .search-close{display:none;width:34px;height:34px}
.top-actions{display:flex;align-items:center;gap:8px;justify-self:end;transition:opacity var(--d2)}
.only-mobile{display:none!important}
body[data-layout="auth"] .search,body[data-layout="auth"] #newBtn{visibility:hidden;opacity:0}
body[data-layout="auth"] .nav-toggle{display:none!important}

.av{--s:24px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-grid;place-items:center;overflow:hidden;background:var(--av,var(--c-lime));color:#111;font:600 calc(var(--s) * .44)/1 var(--f-display);user-select:none}
.av img{width:100%;height:100%;object-fit:cover}
.av-20{--s:20px}.av-22{--s:22px}.av-28{--s:28px}.av-32{--s:32px}.av-36{--s:36px}.av-40{--s:40px}.av-48{--s:48px}.av-96{--s:96px}.av-120{--s:120px}
.me-btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--page);transition:border-color var(--d1)}
.me-btn:hover{border-color:var(--line-2)}
.me-btn .av{--s:36px}
.me-btn svg.i{width:16px;height:16px;color:var(--ink-3);transition:transform var(--d3) var(--ease-out)}
.me-wrap.open .me-btn svg.i{transform:rotate(180deg)}
.me-wrap{position:relative}
.menu{
  position:absolute;right:0;top:calc(100% + 8px);z-index:50;min-width:260px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--elev);
  transform-origin:top right;opacity:0;transform:translateY(-6px) scale(.97);visibility:hidden;pointer-events:none;
  transition:opacity var(--d2) var(--ease-out),transform var(--d3) var(--ease-out),visibility 0s var(--d3);
}
.me-wrap.open .menu{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
.menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head b{display:block;font:600 16px/1.3 var(--f-display)}
.menu-head span{font-size:13px;color:var(--ink-3)}
.menu a,.menu button.mi{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border:0;border-radius:12px;background:none;text-decoration:none;font-size:14.5px;color:var(--ink-2);text-align:left;transition:background-color var(--d1),color var(--d1)}
.menu a:hover,.menu button.mi:hover{background:var(--card-2);color:var(--ink)}
.menu .badge{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ---------- Shell: left nav + content ---------- */
body[data-layout="board"]{background:var(--page)}
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:calc(100vh - var(--top-h))}
body[data-layout="auth"] .shell{grid-template-columns:minmax(0,1fr)}
body[data-layout="auth"] .lnav,body[data-layout="auth"] .scrim{display:none}
.view{min-width:0;min-height:72vh;padding:20px 24px 120px;outline:none}
body[data-layout="auth"] .view{width:100%;max-width:1280px;margin:0 auto}
.view.enter{animation:viewIn 340ms var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.lnav{position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 40px;border-right:1px solid var(--line);background:var(--page);scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;view-transition-name:lnav}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font:500 14.5px/1.2 var(--f-display);transition:background-color var(--d2) var(--ease-out),color var(--d2)}
.nav-item:hover{background:var(--side);color:var(--ink)}
.nav-item.active{background:var(--side);color:var(--ink);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--ink);animation:barIn var(--d3) var(--ease-spring)}
@keyframes barIn{from{transform:scaleY(0)}}
.nav-item>svg.i{width:20px;height:20px}
.nav-item .n{margin-left:auto;font:400 12.5px var(--f-body);color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-item .hash{width:28px;height:28px;border-radius:50%;background:var(--side);display:grid;place-items:center;font:600 13px var(--f-display);color:var(--ink-3);transition:background-color var(--d2)}
.nav-item:hover .hash,.nav-item.active .hash{background:var(--raise)}
.r-ic{width:28px;height:28px;border-radius:50%;background:var(--rc);color:#111;display:grid;place-items:center;flex:none;transition:transform var(--d3) var(--ease-spring)}
.r-ic svg.i{width:14px;height:14px}
.r-ic.lg{width:38px;height:38px}
.r-ic.lg svg.i{width:18px;height:18px}
.r-ic.none{background:var(--side);color:var(--ink-3)}
.nav-item:hover .r-ic{transform:rotate(-12deg)}
.nav-sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.nav-h{display:flex;align-items:center;justify-content:space-between;width:100%;height:38px;padding:0 12px;border:0;border-radius:10px;background:none;font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);transition:background-color var(--d1),color var(--d1)}
.nav-h:hover{background:var(--side);color:var(--ink)}
.nav-h svg.i{width:16px;height:16px;transition:transform var(--d3) var(--ease-out)}
.nav-sec:not(.open) .nav-h svg.i{transform:rotate(-90deg)}
.nav-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--d3) var(--ease-out)}
.nav-body>div{min-height:0;overflow:hidden;display:grid;gap:2px;padding-top:2px}
.nav-sec:not(.open) .nav-body{grid-template-rows:0fr}
.nav-foot{margin:18px 12px 0;font-size:12px;line-height:1.6;color:var(--ink-3)}
.scrim{display:none}

::view-transition-old(root){animation:vtOut 150ms var(--ease-io) both}
::view-transition-new(root){animation:vtIn 320ms var(--ease-out) both}
html.vt-local::view-transition-old(root),html.vt-local::view-transition-new(root){animation:none}
::view-transition-group(*){animation-duration:420ms;animation-timing-function:var(--ease-out)}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
::view-transition-old(topbar),::view-transition-old(mock),::view-transition-old(lnav){display:none}
::view-transition-new(topbar),::view-transition-new(mock),::view-transition-new(lnav){animation:none}
::view-transition-group(topic-title){animation-duration:460ms;animation-timing-function:var(--ease-out)}
::view-transition-old(topic-title){animation:vtOut 200ms var(--ease-out) both}
::view-transition-new(topic-title){animation:vtTitleIn 460ms var(--ease-out) both}
::view-transition-old(topic-title),::view-transition-new(topic-title){height:100%;object-fit:none;object-position:left top}
@keyframes vtTitleIn{from{opacity:0}}

/* ---------- Content columns ---------- */
.feed-layout{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:28px;max-width:1120px;margin:0 auto;align-items:start}
.feed-main{min-width:0;width:100%;max-width:760px;justify-self:center}
.narrow{max-width:760px;margin:0 auto}
.rail-r{position:sticky;top:calc(var(--top-h) + 20px);display:grid;gap:16px;max-height:calc(100vh - var(--top-h) - 40px);overflow-y:auto;scrollbar-width:none;border-radius:22px}
.rail-r::-webkit-scrollbar{display:none}
.rail-foot{margin:0 6px;font-size:12px;color:var(--ink-3)}

.card{position:relative;background:var(--side);border-radius:22px;padding:20px;transition:background-color var(--d3)}
.card .chip{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.card-h h2,.card-h h3{font:700 17px/1.3 var(--f-display);letter-spacing:-.005em;margin:0}
.rise{animation:rise 560ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:popIn 520ms var(--ease-spring) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(10px)}}

.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--side);font:500 13px/1 var(--f-body);color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:background-color var(--d1),color var(--d1),transform var(--d2) var(--ease-out),box-shadow var(--d1)}
a.chip:hover{color:var(--ink);background:var(--raise);box-shadow:inset 0 0 0 1px var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font:600 12px/1 var(--f-display);letter-spacing:.01em;background:var(--card-2);color:var(--ink-2)}
.badge.lime{background:var(--c-lime);color:#111}
.badge.purple{background:var(--c-purple);color:#111}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge svg.i{width:13px;height:13px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud a.on{background:var(--ink);color:var(--page);box-shadow:none}
.who-inline{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500}
mark{background:var(--c-lime);color:#111;border-radius:4px;padding:0 2px}
.more{display:flex;justify-content:center;padding:18px 0 0}

/* ---------- Home top: welcome / create bar ---------- */
.welcome{position:relative;overflow:hidden;border-radius:24px;padding:26px 26px 24px;background:var(--hero);color:var(--hero-ink);margin-bottom:14px}
:root[data-theme="dark"] .welcome{border:1px solid var(--line)}
.welcome h1{position:relative;font:700 clamp(26px,3vw,36px)/1.2 var(--f-display);letter-spacing:-.02em;margin:0;max-width:16ch}
.welcome p{position:relative;margin:8px 0 18px;color:color-mix(in srgb,var(--hero-ink) 62%,transparent);max-width:46ch;font-size:14.5px}
.welcome .acts{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.welcome .btn-white{background:transparent;color:var(--hero-ink);border-color:color-mix(in srgb,var(--hero-ink) 30%,transparent)}
.create-bar{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;margin-bottom:12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;transition:border-color var(--d2)}
.create-bar:hover{border-color:var(--ink-3)}
.create-bar .fake{flex:1;height:40px;display:flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--side);color:var(--ink-3);font-size:14.5px}
.feed-bar{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.sort-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--side);font:600 13.5px var(--f-display);color:var(--ink)}
.sort-pill svg.i{width:16px;height:16px}
.vtoggle{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--side);margin-left:auto}
.vtoggle button{position:relative;z-index:1;width:38px;height:30px;border:0;border-radius:999px;background:none;color:var(--ink-3);display:grid;place-items:center;transition:color var(--d2)}
.vtoggle button[aria-pressed="true"]{color:var(--primary-ink)}
.vtoggle .vt-ind{position:absolute;top:3px;bottom:3px;left:3px;width:38px;border-radius:999px;background:var(--primary);transition:transform var(--d3) var(--ease-out)}
.vtoggle[data-mode="compact"] .vt-ind{transform:translateX(38px)}
.vtoggle svg.i{width:17px;height:17px}

/* ---------- Feed posts (Reddit-style) ---------- */
.feed{list-style:none;margin:0;padding:0}
.feed>li{position:relative}
.feed>li+li::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line);transition:opacity var(--d2)}
.feed>li:hover::before,.feed>li:hover+li::before{opacity:0}
.post{position:relative;padding:12px 16px;margin:2px -4px;border-radius:20px;transition:background-color var(--d2) var(--ease-out)}
.post:hover{background:var(--side)}
.p-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--ink-3);min-width:0}
.p-room{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:600 13.5px var(--f-display)}
a.p-room:hover{text-decoration:underline;text-underline-offset:3px}
.p-room .r-ic{width:24px;height:24px}
.p-room .r-ic svg.i{width:12px;height:12px}
.dot{color:var(--line-2)}
.by{position:relative;z-index:1;color:var(--ink-3);text-decoration:none}
a.by:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.p-title{margin:6px 0 0;font:600 19px/1.4 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.t-link{color:var(--ink);text-decoration:none}
.t-link::after{content:"";position:absolute;inset:0;border-radius:20px}
.t-link:focus-visible{outline:none}
.t-link:focus-visible::after{outline:2px solid var(--ink);outline-offset:-2px}
.flair{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flair a,.flair span{position:relative;z-index:1;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--side);font-size:12.5px;color:var(--ink-2);text-decoration:none;transition:background-color var(--d1),color var(--d1)}
.post:hover .flair a,.post:hover .flair span{background:var(--raise)}
.flair a:hover{color:var(--ink)}
.flair a.on{background:var(--ink)!important;color:var(--page)}
.p-ex{margin:6px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p-media{position:relative;z-index:1;margin-top:10px;border-radius:18px;overflow:hidden;aspect-ratio:16/10;max-height:440px;background:var(--side);border:1px solid var(--line)}
.p-track{display:flex;height:100%;transform:translateX(calc(var(--ci,0) * -100%));transition:transform 520ms var(--ease-out)}
.p-track button{flex:0 0 100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.p-track img{width:100%;height:100%;object-fit:cover}
.car-btn{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;opacity:0;transform:scale(.85);transition:opacity var(--d2),transform var(--d2) var(--ease-spring)}
.car-btn.prev{left:12px}.car-btn.next{right:12px}
.p-media:hover .car-btn,.car-btn:focus-visible{opacity:1;transform:none}
.car-btn:disabled{opacity:0!important;pointer-events:none}
.car-btn svg.i{width:18px;height:18px}
@media (hover:none){.car-btn{opacity:1;transform:none}}
.dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:5px 8px;border-radius:999px;background:rgba(17,17,17,.45);pointer-events:none}
.dots i{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.55);transition:width var(--d3) var(--ease-out),background-color var(--d2)}
.dots i.on{width:16px;background:#fff}
.car-count{position:absolute;right:12px;top:12px;padding:3px 9px;border-radius:999px;background:rgba(17,17,17,.6);color:#fff;font:500 12px var(--f-mono);pointer-events:none}
.p-actions{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--side);color:var(--ink-2);font:600 13px var(--f-display);text-decoration:none;white-space:nowrap;transition:background-color var(--d1),color var(--d1),transform var(--d2) var(--ease-out)}
.post:hover .pill{background:var(--raise)}
.pill:hover{color:var(--ink)}
.pill:active{transform:scale(.96)}
.pill svg.i{width:17px;height:17px}
.post.compact{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px}
.p-thumb{position:relative;width:52px;height:52px;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.p-thumb img{width:100%;height:100%;object-fit:cover}
.post.compact .p-title{font-size:16px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.post.compact .pill{position:relative;z-index:1}

/* ---------- Community banner / heads ---------- */
.c-banner{max-width:1120px;margin:0 auto 20px}
.c-cover{position:relative;height:128px;border-radius:24px;background:var(--rc);overflow:hidden}
.c-head{position:relative;display:flex;align-items:flex-end;gap:16px;padding:0 20px;margin-top:-38px}
.c-icon{width:92px;height:92px;border-radius:50%;background:#111;color:var(--rc);display:grid;place-items:center;border:5px solid var(--page);flex:none;animation:popIn 560ms var(--ease-spring) both}
.c-icon svg.i{width:38px;height:38px;stroke-width:1.6}
.c-head>div{min-width:0;margin-bottom:-12px}
.c-head h1{font:800 clamp(26px,3vw,34px)/1.15 var(--f-display);letter-spacing:-.02em;margin:0}
.c-head p{margin:2px 0 0;font-size:13.5px;color:var(--ink-3)}
.c-head .btn{margin-left:auto;margin-bottom:6px}
.plain-head{padding:4px 4px 14px}
.plain-head h1{font:800 clamp(28px,3.4vw,40px)/1.2 var(--f-display);letter-spacing:-.03em;margin:0}
.plain-head p{margin:6px 0 0;color:var(--ink-3)}

/* right-rail cards */
.about-top{position:relative;height:56px;margin:-20px -20px 16px;border-radius:22px 22px 0 0;background:var(--rc);overflow:hidden}
.about p{margin:0 0 14px;font-size:14px;color:var(--ink-2);line-height:1.65}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stats3 b{display:block;font:800 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.stats3 span{font-size:12px;color:var(--ink-3)}
.recent{display:grid;gap:2px}
.recent a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px;margin:0 -8px;border-radius:14px;text-decoration:none;transition:background-color var(--d1)}
.recent a:hover{background:var(--raise)}
.recent .th{width:44px;height:44px;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.recent .th img{width:100%;height:100%;object-fit:cover}
.recent b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 13.5px/1.35 var(--f-display)}
.recent span span{font-size:12px;color:var(--ink-3)}
.promo{position:relative;display:block;padding:20px 22px;border-radius:22px;background:var(--c-purple);color:#111;text-decoration:none;overflow:hidden;transition:transform var(--d3) var(--ease-out)}
.promo:hover{transform:translateY(-2px)}
.promo b{display:block;font:800 24px/1.08 var(--f-display);letter-spacing:-.02em;max-width:9ch}
.promo span{display:block;font-size:13px;margin-top:8px;max-width:20ch;line-height:1.45}
.promo .shield{position:absolute;right:16px;bottom:-14px;width:100px;height:100px;transform:rotate(10deg);transition:transform var(--d3) var(--ease-spring)}
.promo:hover .shield{transform:rotate(2deg) translateY(-6px)}
.promo.done{background:var(--c-lime)}
.people{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.people li a{display:flex;align-items:center;gap:10px;font-size:14px;text-decoration:none;color:var(--ink-2)}
.people li a:hover{color:var(--ink)}
.people .n{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.tips ol{margin:0;padding-left:18px;display:grid;gap:8px;font-size:13.5px;color:var(--ink-2)}

/* states */
.state{position:relative;padding:48px 32px;text-align:center;border-radius:24px;background:var(--side)}
.state .art{position:relative;width:120px;height:110px;margin:0 auto 14px}
.state h1,.state h2{font:700 26px/1.3 var(--f-display);letter-spacing:-.02em;margin:0 0 6px}
.state p{margin:0 auto 22px;color:var(--ink-2);max-width:42ch}
.state .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.state .code{font:700 64px/1 var(--f-display);letter-spacing:-.04em;margin-bottom:8px}
.feed-main>.state{margin-top:12px}
.sk{position:relative;overflow:hidden;background:var(--side);border-radius:10px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--page) 70%,transparent),transparent);animation:shimmer 1.4s var(--ease-io) infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* ---------- Topic detail ---------- */
.post-full{padding:4px 4px 6px}
.pf-meta{display:flex;align-items:center;gap:10px}
.back-btn{width:38px;height:38px;flex:none;margin-right:2px}
.back-btn svg.i{transition:transform var(--d2) var(--ease-out)}
.back-btn:hover svg.i{transform:translateX(-2px)}
.pf-meta .r-ic{width:36px;height:36px}
.pf-meta .r-ic svg.i{width:16px;height:16px}
.pf-meta .who{display:grid;line-height:1.35;font-size:13px;color:var(--ink-3);min-width:0}
.pf-meta .who a{text-decoration:none;color:inherit}
.pf-meta .who a.room{font:600 14px var(--f-display);color:var(--ink)}
.pf-meta .who a:hover{text-decoration:underline;text-underline-offset:3px}
.topic-title{font:700 clamp(24px,2.6vw,32px)/1.3 var(--f-display);letter-spacing:-.02em;margin:14px 0 4px;text-wrap:balance}
.prose{font-size:16px;line-height:1.85;padding:12px 0 4px;overflow-wrap:anywhere}
.prose p{margin:0 0 1em;max-width:72ch}
.gallery{display:grid;gap:6px;margin:8px 0 6px;border-radius:18px;overflow:hidden}
.gallery button{position:relative;padding:0;border:0;background:var(--side);overflow:hidden;cursor:zoom-in;min-height:0}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform 600ms var(--ease-out)}
.gallery button:hover img{transform:scale(1.04)}
.gallery.g1{grid-template-columns:1fr}.gallery.g1 button{aspect-ratio:16/10}
.gallery.g2{grid-template-columns:1fr 1fr}.gallery.g2 button{aspect-ratio:4/5}
.gallery.g3{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:16/10}.gallery.g3 button:first-child{grid-row:span 2}
.gallery.g4{grid-template-columns:1fr 1fr;aspect-ratio:1/0.8}
.post-full .p-actions{margin-top:12px}

.join{display:grid;margin:18px 0 8px}
.join>.join-pill,.join>.join-form{grid-area:1/1}
.join-pill{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--ink-3);font-size:14.5px;text-align:left;transition:border-color var(--d2),opacity var(--d2)}
.join-pill:hover{border-color:var(--ink)}
.join-form{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--d3) var(--ease-out),opacity var(--d2)}
.join-form>div{min-height:0;overflow:hidden}
.join.open .join-form{grid-template-rows:1fr;opacity:1}
.join.open .join-pill{opacity:0;pointer-events:none}
.c-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 2px;padding-top:14px;border-top:1px solid var(--line)}
.c-toolbar h2{font:700 18px/1.3 var(--f-display);margin:0}
.c-count{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 9px;border-radius:999px;background:var(--c-lime);color:#111;font:700 14px/1 var(--f-display)}
.c-count.bump{animation:bump 460ms var(--ease-spring)}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}
.c-sort{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.refresh.loading svg.i{animation:spin .8s linear infinite}
.comments{padding:4px 0 4px}
.comments>*{padding:16px 0}
.comment{position:relative}
.c-main{margin:-8px -12px;padding:8px 12px;border-radius:16px}
.comment.fresh>.c-main{animation:freshBg 2.8s var(--ease-out)}
@keyframes freshBg{0%,25%{background:color-mix(in srgb,var(--c-lime) 45%,transparent)}100%{background:transparent}}
.c-top{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.c-name{font:600 15px var(--f-display);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.c-name:hover{text-decoration:underline;text-underline-offset:3px}
.c-top time{color:var(--ink-3);white-space:nowrap}
.op{height:20px;font-size:11px;padding:0 8px}
.c-no{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
.c-body{margin:4px 0 0 40px;font-size:15px;line-height:1.75;overflow-wrap:anywhere}
.c-body p{margin:0 0 .5em}
.c-body p:last-child{margin:0}
.c-img{margin:10px 0 2px 40px;padding:0;border:0;background:none;cursor:zoom-in;border-radius:16px;overflow:hidden;display:block;width:min(260px,100%)}
.c-img img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform 600ms var(--ease-out)}
.c-img:hover img{transform:scale(1.04)}
.reply-to{color:var(--c-purple-ink);font-weight:600;margin-right:2px}
.c-actions{display:flex;gap:4px;margin:6px 0 0 34px}
.c-actions .when-closed{display:none}
.comment.collapsed>.c-main .when-open{display:none}
.comment.collapsed>.c-main .when-closed{display:inline}
.comment.collapsed>.c-main .tog{color:var(--c-purple-ink)}
.thread-line{position:absolute;left:0;top:42px;bottom:2px;width:32px;border:0;padding:0;background:none;cursor:pointer}
.thread-line::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;border-radius:2px;background:var(--line);transition:background-color var(--d2)}
.thread-line:hover::before{background:var(--ink)}
.comment.collapsed>.thread-line{bottom:calc(100% - 70px)}
.children-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--d3) var(--ease-out)}
.children{min-height:0;overflow:hidden;padding-left:40px;transition:opacity var(--d3) var(--ease-out)}
.children>*{padding-top:16px}
.comment.collapsed>.children-wrap{grid-template-rows:0fr}
.comment.collapsed>.children-wrap>.children{opacity:0}
.slot{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d3) var(--ease-out)}
.slot>div{min-height:0;overflow:hidden}
.slot.open{grid-template-rows:1fr}
.slot>div>.composer{margin:12px 0 4px 40px}
.grow{display:grid;animation:grow 460ms var(--ease-out)}
.grow>*{min-height:0;overflow:hidden}
@keyframes grow{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
.c-empty{position:relative;padding:30px 0 10px;text-align:center;color:var(--ink-3)}
.c-empty b{display:block;color:var(--ink);font:600 18px/1.4 var(--f-display)}

.composer{background:var(--side);border:1px solid var(--line);border-radius:22px;transition:border-color var(--d2),box-shadow var(--d2)}
.composer:focus-within{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.composer.invalid{border-color:var(--danger)}
.composer textarea{display:block;width:100%;min-height:96px;max-height:420px;padding:16px 18px 6px;border:0;background:none;resize:none;outline:none;font-size:15px;line-height:1.7;transition:height 120ms var(--ease-out)}
.composer.compact textarea{min-height:66px}
.composer textarea::placeholder{color:var(--ink-3)}
.composer-bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;flex-wrap:wrap}
.as-who{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.as-who b{color:var(--ink);font-weight:600}
.composer-bar .spacer{flex:1}
.hint{font-size:12px;color:var(--ink-3)}
.hint kbd{font:500 11px var(--f-mono)}
.attach{position:relative}
.attach input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.c-attach{display:flex;gap:8px;padding:0 14px}
.c-attach:empty{display:none}
.form-msg{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d2) var(--ease-out)}
.form-msg>div{min-height:0;overflow:hidden;color:var(--danger);font-size:13px}
.form-msg.show{grid-template-rows:1fr}
.form-msg.show>div{padding:8px 4px 0}
.login-cta{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0 8px;padding:20px 22px;border-radius:22px;background:var(--hero);color:var(--hero-ink);overflow:hidden}
.login-cta b{display:block;font:700 19px/1.3 var(--f-display)}
.login-cta span{font-size:13.5px;opacity:.7}
.login-cta .acts{margin-left:auto;display:flex;gap:8px}
.login-cta .btn-white{background:transparent;color:var(--hero-ink);border-color:color-mix(in srgb,var(--hero-ink) 30%,transparent)}

/* profile */
.u-head{display:flex;align-items:center;gap:18px;padding:4px 4px 18px}
.u-head .av{--s:96px;font-size:36px;border:4px solid var(--c-lime)}
.u-head h1{font:800 clamp(26px,3vw,36px)/1.15 var(--f-display);letter-spacing:-.02em;margin:0}
.u-head .handle{color:var(--ink-3);font-size:14px}
.u-card{position:relative;overflow:hidden;padding:20px;border-radius:22px;background:var(--hero);color:var(--hero-ink);display:grid;gap:14px}
:root[data-theme="dark"] .u-card{border:1px solid var(--line)}
.u-card .u-top{display:flex;align-items:center;gap:12px}
.u-card .u-top b{display:block;font:700 17px/1.3 var(--f-display)}
.u-card .u-top span{font-size:13px;opacity:.6}
.u-card p{margin:0;font-size:14px;opacity:.8;line-height:1.6}
.u-joined{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.65}
.u-joined svg.i{width:16px;height:16px}
.p-stats{display:flex;gap:10px}
.p-stat{flex:1;padding:14px 12px;border-radius:18px;background:var(--c-lime);color:#111;text-align:center}
.p-stat:nth-child(2){background:var(--c-purple)}
.p-stat b{display:block;font:800 28px/1 var(--f-display)}
.p-stat span{font-size:12px}
.tabs{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--side);margin-bottom:8px}
.tabs a{position:relative;z-index:1;height:40px;padding:0 20px;display:grid;place-items:center;border-radius:999px;text-decoration:none;font:600 14.5px var(--f-display);color:var(--ink-3);transition:color var(--d2)}
.tabs a.on{color:var(--primary-ink)}
.tabs .tab-ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--primary);transition:transform var(--d3) var(--ease-out),width var(--d3) var(--ease-out)}
.ccard{display:block;padding:14px 16px;border-radius:18px;text-decoration:none;transition:background-color var(--d2)}
.ccard:hover{background:var(--side)}
.ccard+.ccard{border-top:1px solid var(--line)}
.ccard .on-topic{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.ccard .on-topic b{color:var(--ink);font-weight:600}

/* ---------- Forms ---------- */
.field{display:grid;gap:8px;margin-bottom:20px}
.label-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.label{font:600 14.5px/1.3 var(--f-display)}
.label .opt{font:400 13px var(--f-body);color:var(--ink-3);margin-left:4px}
.counter{font:400 11.5px/1 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums;transition:color var(--d1)}
.counter.near{color:var(--warn)}
.counter.over{color:var(--danger);font-weight:500}
.help{font-size:12.5px;color:var(--ink-3);margin:0}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap>svg.i{position:absolute;left:16px;color:var(--ink-3);pointer-events:none;transition:color var(--d1)}
.input-wrap:focus-within>svg.i{color:var(--ink)}
.input-wrap .input{padding-left:46px}
.input-wrap .eye{position:absolute;right:6px;width:40px;height:40px}
.input-wrap .eye svg.i{position:absolute;inset:0;margin:auto;transition:opacity var(--d2),transform var(--d2) var(--ease-out)}
.input-wrap .eye .off{opacity:0;transform:scale(.7)}
.input-wrap .eye.on .off{opacity:1;transform:none}
.input-wrap .eye.on .on{opacity:0;transform:scale(.7)}
.input,.textarea{width:100%;height:54px;padding:0 16px;background:var(--card);border:1px solid var(--line-2);border-radius:16px;outline:none;color:var(--ink);font-size:15px;transition:border-color var(--d1),box-shadow var(--d1),background-color var(--d3)}
.input:hover,.textarea:hover{border-color:var(--ink-3)}
.input:focus,.textarea:focus{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
.input[readonly]{background:var(--card-2);color:var(--ink-2)}
.input-title{height:62px;font:600 21px/1.3 var(--f-display);letter-spacing:-.01em}
.textarea{height:auto;min-height:200px;padding:14px 16px;resize:none;line-height:1.8;transition:border-color var(--d1),box-shadow var(--d1),height 120ms var(--ease-out)}
.field.invalid .input,.field.invalid .textarea,.field.invalid .tag-box,.field.invalid .dropzone{border-color:var(--danger)}
.field.invalid .input:focus,.field.invalid .textarea:focus{box-shadow:inset 0 0 0 1px var(--danger)}
.field-msg{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d2) var(--ease-out)}
.field-msg>div{min-height:0;overflow:hidden;display:flex;align-items:center;gap:6px;color:var(--danger);font-size:13px}
.field-msg svg.i{width:15px;height:15px}
.field.invalid .field-msg{grid-template-rows:1fr}
.check{display:inline-flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink-2);cursor:pointer;line-height:1.5}
.check input{appearance:none;width:20px;height:20px;margin:1px 0 0;flex:none;border:1.5px solid var(--line-2);border-radius:6px;background:var(--card);display:grid;place-items:center;transition:background-color var(--d1),border-color var(--d1)}
.check input::after{content:"";width:10px;height:6px;border:2px solid var(--primary-ink);border-top:0;border-right:0;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform var(--d2) var(--ease-spring)}
.check input:checked{background:var(--primary);border-color:var(--primary)}
.check input:checked::after{transform:rotate(-45deg) scale(1)}
.check input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 16px;margin-bottom:18px;border-radius:18px;background:var(--danger-soft);color:var(--ink);outline:none;animation:alertIn 380ms var(--ease-out)}
.alert>svg.i{color:var(--danger);margin-top:2px}
.alert b{font-weight:600}
.alert.info{background:color-mix(in srgb,var(--c-purple) 22%,var(--card))}
.alert.info>svg.i{color:var(--c-purple-ink)}
.alert.ok{background:color-mix(in srgb,var(--c-lime) 40%,var(--card))}
.alert.ok>svg.i{color:#111}
.alert ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.alert ul button{border:0;background:none;padding:0;font-size:14px;color:var(--danger);text-decoration:underline;text-underline-offset:3px;text-align:left}
.alert details{grid-column:2;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.alert summary{cursor:pointer;width:max-content}
.alert pre{margin:8px 0 0;padding:10px 12px;background:var(--card);border-radius:12px;font:400 12px/1.55 var(--f-mono);overflow:auto;max-height:220px}
@keyframes alertIn{from{opacity:0;transform:translateY(-6px)}}

/* room dropdown / tags / dropzone */
.room-select{position:relative;width:max-content;max-width:100%}
.rs-btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font:600 15px var(--f-display);transition:border-color var(--d1),box-shadow var(--d1)}
.rs-btn:hover{border-color:var(--ink-3)}
.rs-btn[aria-expanded="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rs-btn .r-ic{width:32px;height:32px}
.rs-btn>svg.i{width:16px;height:16px;color:var(--ink-3);transition:transform var(--d3) var(--ease-out)}
.rs-btn[aria-expanded="true"]>svg.i{transform:rotate(180deg)}
.field.invalid .rs-btn{border-color:var(--danger)}
.rs-pop{position:absolute;left:0;top:calc(100% + 8px);z-index:6;width:300px;max-width:calc(100vw - 32px);padding:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--elev);transform-origin:top left;opacity:0;transform:translateY(-6px) scale(.97);visibility:hidden;pointer-events:none;transition:opacity var(--d2) var(--ease-out),transform var(--d3) var(--ease-out),visibility 0s var(--d3)}
.room-select.open .rs-pop{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
.rs-opt{position:relative;display:flex;align-items:center;gap:12px;height:48px;padding:0 10px;border-radius:12px;cursor:pointer;font:500 15px var(--f-display);transition:background-color var(--d1)}
.rs-opt:hover,.rs-opt:has(input:focus-visible){background:var(--side)}
.rs-opt input{position:absolute;opacity:0;pointer-events:none}
.rs-opt .n{margin-left:auto;font:400 12.5px var(--f-body);color:var(--ink-3)}
.rs-opt .ck{width:18px;height:18px;opacity:0;transform:scale(.6);transition:opacity var(--d2),transform var(--d3) var(--ease-spring)}
.rs-opt:has(input:checked) .ck{opacity:1;transform:none}
.tag-field{position:relative}
.tag-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:54px;padding:8px 10px;background:var(--card);border:1px solid var(--line-2);border-radius:16px;cursor:text;transition:border-color var(--d1),box-shadow var(--d1)}
.tag-box:hover{border-color:var(--ink-3)}
.tag-box:focus-within{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tag-box input{flex:1;min-width:120px;height:34px;border:0;background:none;outline:none;font-size:14.5px;padding:0 4px}
.tchip{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 4px 0 12px;border-radius:999px;background:var(--ink);color:var(--card);font-size:14px;animation:chipIn 280ms var(--ease-spring);transition:opacity 160ms,transform 160ms var(--ease-out)}
.tchip.out{opacity:0;transform:scale(.85)}
.tchip .x{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:50%;background:none;color:inherit;opacity:.7;transition:opacity var(--d1),background-color var(--d1)}
.tchip .x:hover{opacity:1;background:color-mix(in srgb,var(--card) 18%,transparent)}
.tchip .x svg.i{width:13px;height:13px}
.tchip .new{font-size:10.5px;font-weight:600;margin-left:6px;padding:2px 6px;border-radius:999px;background:var(--c-lime);color:#111}
@keyframes chipIn{from{opacity:0;transform:scale(.8)}}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;list-style:none;margin:0;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--elev);opacity:0;transform:translateY(-4px);pointer-events:none;visibility:hidden;transition:opacity var(--d1),transform var(--d2) var(--ease-out),visibility 0s var(--d2)}
.suggest.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.suggest li{display:flex;justify-content:space-between;align-items:center;height:38px;padding:0 12px;border-radius:12px;font-size:14px;cursor:pointer;transition:background-color 80ms}
.suggest li.active{background:var(--card-2)}
.suggest li .n{font-size:12px;color:var(--ink-3)}
.suggest li.create{color:var(--c-purple-ink);font-weight:600}

.dropzone{position:relative;display:grid;place-items:center;gap:6px;padding:26px 16px;border:1.5px dashed var(--line-2);border-radius:20px;background:var(--card);text-align:center;cursor:pointer;transition:border-color var(--d2),background-color var(--d2),transform var(--d2) var(--ease-out)}
.dropzone:hover{border-color:var(--ink-3)}
.dropzone.drag{border-color:var(--ink);background:color-mix(in srgb,var(--c-lime) 25%,var(--card));transform:scale(1.01)}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.dropzone .dz-ic{width:52px;height:52px;border-radius:50%;background:var(--c-lime);color:#111;display:grid;place-items:center;transition:transform var(--d3) var(--ease-spring)}
.dropzone:hover .dz-ic,.dropzone.drag .dz-ic{transform:translateY(-3px) rotate(-8deg)}
.dropzone b{font:600 15px var(--f-display)}
.dropzone span{font-size:12.5px;color:var(--ink-3)}
.dropzone.full{display:none}
.uploads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.uploads:empty{display:none}
.up{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--card-2);animation:popIn 420ms var(--ease-spring)}
.up img{width:100%;height:100%;object-fit:cover;transition:filter var(--d3),transform var(--d3) var(--ease-out)}
.up.uploading img{filter:saturate(.4) brightness(.85)}
.up .bar{position:absolute;left:10px;right:10px;bottom:10px;height:6px;border-radius:999px;background:rgba(255,255,255,.45);overflow:hidden;transition:opacity var(--d2)}
.up .bar i{display:block;height:100%;width:calc(var(--p,0) * 1%);background:#111;border-radius:999px;transition:width 200ms linear}
.up.done .bar{opacity:0}
.up .rm{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(17,17,17,.75);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity var(--d2),transform var(--d2) var(--ease-spring)}
.up:hover .rm,.up:focus-within .rm,.up.error .rm{opacity:1;transform:none}
.up .rm svg.i{width:14px;height:14px}
.up .ok{position:absolute;left:8px;bottom:8px;width:24px;height:24px;border-radius:50%;background:var(--c-lime);color:#111;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:opacity var(--d2),transform var(--d3) var(--ease-spring)}
.up.done .ok{opacity:1;transform:none}
.up .ok svg.i{width:13px;height:13px;stroke-width:2.6}
.up.error{display:grid;place-items:center;padding:10px;text-align:center;background:var(--danger-soft);color:var(--danger);font-size:12px;line-height:1.4}
.up.error svg.i{margin:0 auto 4px}
.up.error .retry{margin-top:6px;border:0;background:none;color:var(--ink);font-weight:600;text-decoration:underline;font-size:12px}
.up.out{animation:none;opacity:0;transform:scale(.85);transition:opacity 180ms,transform 180ms}
.c-thumb{position:relative;width:76px;height:76px;margin-top:4px;border-radius:14px;overflow:hidden;animation:popIn 420ms var(--ease-spring)}

.form-foot{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;gap:10px;padding:14px 0 18px;margin-top:6px;background:linear-gradient(to bottom,transparent,var(--page) 30%)}
.form-foot .spacer{flex:1}
.create-h{position:relative;margin:4px 0 20px}
.create-h h1{font:700 34px/1.2 var(--f-display);letter-spacing:-.02em;margin:0}
.create-h p{margin:4px 0 0;color:var(--ink-3)}
#previewRow{pointer-events:none}
#previewRow .post{margin:0 -16px;padding:0 0 2px;background:none}
.preview-body{max-height:300px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);font-size:14px;line-height:1.8;color:var(--ink-2)}
.preview-body p{margin:0 0 .8em}
.preview-body .gallery{margin-top:0}
.placeholder{color:var(--ink-3);font-style:italic}
.seg{position:relative;display:none;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:16px;border-radius:999px;background:var(--side)}
.seg button{position:relative;z-index:1;height:40px;border:0;background:none;border-radius:999px;font:600 14.5px var(--f-display);color:var(--ink-3);transition:color var(--d2)}
.seg button[aria-selected="true"]{color:var(--primary-ink)}
.seg .seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--primary);transition:transform var(--d3) var(--ease-out)}
.seg[data-tab="preview"] .seg-ind{transform:translateX(100%)}

/* ---------- Auth ---------- */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;min-height:calc(100vh - var(--top-h) - 40px)}
.auth-art{position:relative;background:#111;color:#fff;border-radius:36px;padding:44px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:560px}
.auth-art h2{position:relative;z-index:1;font:700 clamp(36px,4vw,58px)/1.14 var(--f-display);letter-spacing:-.03em;margin:0;max-width:11ch}
.auth-art p{position:relative;z-index:1;color:rgba(255,255,255,.6);max-width:36ch;margin:14px 0 0}
.collage{position:relative;height:300px;margin-top:20px}
.float-card{position:absolute;width:250px;padding:14px 16px;border-radius:22px;background:var(--fc,#fff);color:#111;transform:rotate(var(--r,0deg));animation:floaty 7s var(--ease-io) infinite alternate,popIn 640ms var(--ease-spring) both;animation-delay:var(--fd,0s),var(--pd,0s)}
.float-card b{display:block;font:600 15px/1.35 var(--f-display)}
.float-card span{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.7;margin-top:6px}
@keyframes floaty{from{translate:0 0}to{translate:0 -10px}}
.auth-form{display:grid;place-items:center;padding:24px 8px}
.auth-card{width:min(440px,100%)}
.auth-card h1{font:700 34px/1.2 var(--f-display);letter-spacing:-.025em;margin:0 0 6px}
.auth-card .lead{color:var(--ink-2);margin:0 0 26px}
.auth-card .lead b{color:var(--ink)}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-2)}
.auth-switch{text-align:center;margin-top:22px;font-size:14px;color:var(--ink-2)}
.g-mark{width:18px;height:18px}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:26px;list-style:none;padding:0}
.stepper li{display:flex;align-items:center;gap:8px;font:500 13px/1 var(--f-display);color:var(--ink-3);white-space:nowrap;transition:color var(--d3)}
.stepper li .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);font-weight:600;transition:background-color var(--d3),border-color var(--d3),color var(--d3)}
.stepper li.on{color:var(--ink)}
.stepper li.on .n{border-color:var(--ink)}
.stepper li.done .n{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.stepper .ln{flex:1;min-width:16px;height:2px;border-radius:2px;background:var(--line-2);overflow:hidden}
.stepper .ln i{display:block;height:100%;width:0;background:var(--ink);transition:width 600ms var(--ease-out)}
.stepper .ln.fill i{width:100%}

.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:4px 0 8px}
.otp-box{width:100%;height:64px;text-align:center;border:1px solid var(--line-2);border-radius:18px;background:var(--card);font:700 28px/1 var(--f-display);outline:none;caret-color:var(--ink);transition:border-color var(--d1),box-shadow var(--d1),background-color var(--d2),transform var(--d2) var(--ease-spring)}
.otp-box:focus{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.otp-box.filled{background:color-mix(in srgb,var(--c-lime) 38%,var(--card));animation:otpPop 260ms var(--ease-spring)}
@keyframes otpPop{50%{transform:scale(1.08)}}
.otp.bad .otp-box{border-color:var(--danger);background:var(--danger-soft)}
.otp.shake{animation:shake 420ms var(--ease-out)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.otp.ok .otp-box{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.totp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);margin:6px 0 18px}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line-2)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}
.strength i{height:6px;border-radius:999px;background:var(--line);transition:background-color var(--d3) var(--ease-out)}
.strength[data-s="1"] i:nth-child(-n+1){background:var(--danger)}
.strength[data-s="2"] i:nth-child(-n+2){background:var(--c-orange)}
.strength[data-s="3"] i:nth-child(-n+3){background:var(--c-blue)}
.strength[data-s="4"] i:nth-child(-n+4){background:var(--ok)}
.rules{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px;color:var(--ink-3)}
.rules li{display:flex;align-items:center;gap:6px;transition:color var(--d2)}
.rules li .c{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:background-color var(--d2),border-color var(--d2)}
.rules li .c svg{width:10px;height:10px;stroke:#111;stroke-width:3;fill:none;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset var(--d3) var(--ease-out)}
.rules li.ok{color:var(--ink)}
.rules li.ok .c{background:var(--c-lime);border-color:var(--c-lime)}
.rules li.ok .c svg{stroke-dashoffset:0}
.success-mark{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--c-lime);display:grid;place-items:center;animation:popIn 600ms var(--ease-spring) both}
.success-mark svg{width:46px;height:46px;stroke:#111;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw 520ms 320ms var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.choice{display:flex;align-items:center;gap:14px;padding:18px;border-radius:22px;border:1px solid var(--line-2);background:var(--card);text-decoration:none;transition:border-color var(--d1),transform var(--d2) var(--ease-out)}
.choice:hover{border-color:var(--ink);transform:translateY(-2px)}
.choice .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--rc,var(--card-2));color:#111;flex:none}
.choice b{display:block;font:600 16px var(--f-display)}
.choice span{font-size:13px;color:var(--ink-3)}
.choice>svg.i:last-child{margin-left:auto;color:var(--ink-3)}

/* 2FA setup */
.setup-card{max-width:620px;margin:0 auto;padding:36px}
.step-pane{animation:stepIn 420ms var(--ease-out)}
.step-pane.back{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(24px)}}
@keyframes stepBack{from{opacity:0;transform:translateX(-24px)}}
.qr-row{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin:20px 0}
.qr{width:180px;height:180px;padding:12px;border-radius:22px;background:#fff;border:1px solid var(--line)}
.qr svg{width:100%;height:100%}
.secret{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--card-2);font:500 14px/1.3 var(--f-mono);letter-spacing:.06em;word-break:break-all}
.secret .icon-btn{width:34px;height:34px;margin-left:auto}

/* ---------- Settings / profile ---------- */
.settings{max-width:820px;margin:0 auto;display:grid;gap:16px}
.snav{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--side);justify-self:start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.snav a{flex:none;display:flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:999px;text-decoration:none;font:600 14.5px var(--f-display);color:var(--ink-2);transition:background-color var(--d2),color var(--d2)}
.snav a svg.i{width:18px;height:18px}
.snav a:hover{color:var(--ink)}
.snav a.on{background:var(--primary);color:var(--primary-ink)}
.s-stack{display:grid;gap:20px}
.s-card{padding:28px 30px}
.s-card .desc{color:var(--ink-3);font-size:14px;margin:-8px 0 18px}
.avatar-edit{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.avatar-edit .av{--s:112px;font-size:40px}
.avatar-btn{position:relative;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.avatar-btn .cam{position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;border:3px solid var(--card);transition:transform var(--d3) var(--ease-spring)}
.avatar-btn:hover .cam{transform:scale(1.1) rotate(-8deg)}
.avatar-btn .cam svg.i{width:16px;height:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.prefix{position:absolute;left:16px;color:var(--ink-3);pointer-events:none}
.prefix+.input{padding-left:34px}
.sec-row{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.sec-row:first-of-type{border-top:0;padding-top:4px}
.sec-row .ic{width:48px;height:48px;border-radius:16px;background:var(--card-2);display:grid;place-items:center;flex:none}
.sec-row b{display:flex;align-items:center;gap:8px;font:600 16px var(--f-display)}
.sec-row span{font-size:13.5px;color:var(--ink-3)}
.sec-row .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d3) var(--ease-out)}
.expand>div{min-height:0;overflow:hidden}
.expand.open{grid-template-rows:1fr}
.expand>div>form{padding:4px 0 18px}
.session{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);transition:opacity var(--d3),transform var(--d3) var(--ease-out)}
.session:first-child{border-top:0}
.session.out{opacity:0;transform:translateX(16px)}
.session .ic{width:44px;height:44px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;flex:none}
.session b{display:flex;align-items:center;gap:8px;font:600 15px var(--f-display)}
.session span{font-size:13px;color:var(--ink-3)}
.session .btn{margin-left:auto}

/* crop dialog */
.crop-stage{position:relative;width:280px;height:280px;margin:6px auto 18px;border-radius:24px;overflow:hidden;background:#111;touch-action:none;cursor:grab}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center;will-change:transform}
.crop-stage .mask{position:absolute;inset:20px;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.55);border:2px solid #fff;pointer-events:none}
.zoom-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--ink-3)}
.zoom-row input{flex:1;accent-color:var(--ink)}

/* ---------- Lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:48px 72px;background:rgba(8,8,8,0);transition:background-color var(--d3) var(--ease-out);visibility:hidden}
.lightbox.open{background:rgba(8,8,8,.88);visibility:visible}
.lightbox.closing{background:rgba(8,8,8,0)}
.lightbox img{max-width:100%;max-height:calc(100vh - 140px);border-radius:20px;transform-origin:center;transition:transform 460ms var(--ease-out),opacity 300ms var(--ease-out)}
.lightbox .lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity var(--d3),background-color var(--d1)}
.lightbox.open .lb-btn{opacity:1}
.lightbox .lb-btn:hover{background:rgba(255,255,255,.22)}
.lightbox .lb-close{top:20px;right:20px}
.lightbox .lb-prev{left:16px;top:50%;margin-top:-24px}
.lightbox .lb-next{right:16px;top:50%;margin-top:-24px}
.lightbox .lb-count{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font:500 13px var(--f-mono);opacity:0;transition:opacity var(--d3)}
.lightbox.open .lb-count{opacity:1}

/* ---------- Toast / dialog ---------- */
.toasts{position:fixed;left:50%;bottom:24px;z-index:95;display:grid;gap:8px;justify-items:center;transform:translateX(-50%);pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px 12px 12px;border-radius:999px;background:#111;color:#fff;font:500 14px var(--f-body);box-shadow:var(--elev);opacity:0;transform:translateY(14px) scale(.96);transition:opacity var(--d2) var(--ease-out),transform var(--d3) var(--ease-spring)}
:root[data-theme="dark"] .toast{background:#f2f2ec;color:#111}
.toast.show{opacity:1;transform:none}
.toast .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c-lime);color:#111}
.toast.err .ti{background:var(--danger);color:#fff}
.toast .ti svg.i{width:14px;height:14px;stroke-width:2.4}
.dialog{width:min(420px,calc(100vw - 32px));padding:28px;border:0;border-radius:28px;background:var(--card);color:var(--ink);box-shadow:var(--elev);opacity:0;transform:translateY(14px) scale(.97);transition:opacity var(--d2) var(--ease-out),transform var(--d3) var(--ease-spring)}
.dialog.show{opacity:1;transform:none}
.dialog::backdrop{background:transparent;transition:background-color var(--d3)}
.dialog.show::backdrop{background:var(--overlay)}
.dialog h2{font:700 22px/1.3 var(--f-display);margin:0 0 6px}
.dialog p{margin:0 0 20px;color:var(--ink-2);font-size:14.5px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* ---------- Mock panel (reviewer tool, not product UI) ---------- */
.mock{position:fixed;left:16px;bottom:16px;z-index:96;view-transition-name:mock}
.mock-toggle{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px dashed var(--ink-3);background:var(--card);color:var(--ink-2);font:500 11.5px/1 var(--f-mono);letter-spacing:.06em;transition:color var(--d1),border-color var(--d1)}
.mock-toggle:hover{color:var(--ink);border-color:var(--ink-2)}
.mock-toggle svg.i{width:12px;height:12px;transition:transform var(--d3) var(--ease-out)}
.mock.open .mock-toggle svg.i{transform:rotate(180deg)}
.mock-pop{position:absolute;left:0;bottom:calc(100% + 8px);width:320px;max-height:min(680px,calc(100vh - 80px));overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--elev);padding:16px;transform-origin:left bottom;opacity:0;transform:translateY(6px) scale(.97);visibility:hidden;pointer-events:none;transition:opacity var(--d2) var(--ease-out),transform var(--d3) var(--ease-out),visibility 0s var(--d3)}
.mock.open .mock-pop{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
.mock-h{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;color:var(--ink-3);margin:4px 0 8px;text-transform:uppercase}
.mock-h:not(:first-child){margin-top:16px}
.mock-links{display:grid;gap:1px}
.mock-links a,.mock-links button{display:flex;justify-content:space-between;gap:8px;width:calc(100% + 16px);padding:6px 8px;margin:0 -8px;border:0;background:none;border-radius:10px;text-decoration:none;font-size:13.5px;color:var(--ink-2);text-align:left;transition:background-color var(--d1),color var(--d1)}
.mock-links a:hover,.mock-links button:hover{background:var(--card-2);color:var(--ink)}
.mock-links a.on{color:var(--ink);font-weight:600}
.mock-links span{font:400 11px var(--f-mono);color:var(--ink-3)}
.creds{font:400 12px/1.7 var(--f-mono);color:var(--ink-2);background:var(--card-2);border-radius:12px;padding:10px 12px}
.creds b{color:var(--ink);font-weight:500}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.switch small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.4}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{position:relative;width:36px;height:22px;flex:none;border-radius:999px;background:var(--line-2);transition:background-color var(--d2)}
.track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--d3) var(--ease-spring)}
.switch input:checked+.track{background:var(--ink)}
.switch input:checked+.track::after{transform:translateX(14px);background:var(--c-lime)}
.switch input:focus-visible+.track{outline:2px solid var(--ink);outline-offset:2px}
.theme-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:999px;background:var(--card-2)}
.theme-seg button{height:30px;border:0;border-radius:999px;background:none;font-size:12.5px;color:var(--ink-3);transition:background-color var(--d2),color var(--d2)}
.theme-seg button.on{background:var(--ink);color:var(--card)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .feed-layout{grid-template-columns:minmax(0,1fr)}
  .rail-r{display:none}
  .seg{display:grid}
  #newLayout[data-tab="preview"] .create{display:none}
  #newLayout[data-tab="preview"] .rail-r{display:grid;position:static;max-height:none;animation:viewIn 300ms var(--ease-out)}
  #newLayout[data-tab="write"] .create{animation:viewIn 300ms var(--ease-out)}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-art{min-height:0;padding:32px}
  .collage{display:none}
}
@media (max-width:1024px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar-in{grid-template-columns:auto minmax(0,1fr) auto}
  .nav-toggle{display:inline-grid}
  .lnav{position:fixed;left:0;top:var(--top-h);bottom:0;height:auto;z-index:45;width:min(300px,86vw);visibility:hidden;transform:translateX(-102%);transition:transform 420ms var(--ease-out),box-shadow var(--d3),visibility 0s 420ms}
  body.nav-open .lnav{visibility:visible;transform:none;box-shadow:var(--elev);transition:transform 420ms var(--ease-out),box-shadow var(--d3),visibility 0s}
  .scrim{display:block;position:fixed;inset:var(--top-h) 0 0 0;z-index:44;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity var(--d3) var(--ease-out)}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
@media (max-width:860px){
  :root{--top-h:64px}
  .topbar-in{gap:8px;padding:0 12px 0 8px}
  .search{position:absolute;left:12px;right:12px;top:10px;max-width:none;opacity:0;transform:translateY(-6px);pointer-events:none;background:var(--page);border-color:var(--line-2)}
  .search kbd{display:none}
  .search .search-close{display:inline-grid}
  .topbar.search-open .search{opacity:1;transform:none;pointer-events:auto;visibility:visible}
  .topbar.search-open .brand-wrap,.topbar.search-open .top-actions{opacity:0;pointer-events:none}
  .only-mobile{display:inline-grid!important}
  .hide-mobile{display:none!important}
  body[data-layout="auth"] [data-action="search-open"]{display:none!important}
  #newBtn{width:44px;padding:0}
  #newBtn .lbl{display:none}
  .me-btn{padding:0 4px;border:0;background:none}
  .me-btn svg.i{display:none}
  .view{padding:14px 12px 120px}
  .welcome{padding:22px 20px 20px}
  .c-cover{height:92px;border-radius:20px}
  .c-head{padding:0 6px;margin-top:-30px;gap:12px}
  .c-icon{width:70px;height:70px;border-width:4px}
  .c-icon svg.i{width:28px;height:28px}
  .c-head{flex-wrap:wrap;align-items:flex-end}
  .c-head>div{order:3;flex-basis:100%;margin:6px 0 0}
  .c-head .btn{width:44px;padding:0}
  .c-head .btn .lbl{display:none}
  .s-card,.setup-card{padding:24px 20px}
  .auth-art{display:none}
  .auth-form{padding:12px 0}
  .qr-row{grid-template-columns:1fr;justify-items:center;text-align:center}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:520px){
  .post{padding:12px}
  .p-title{font-size:17px}
  .p-media{aspect-ratio:4/3}
  .post.compact{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:10px}
  .p-thumb{width:44px;height:44px}
  .u-head .av{--s:72px}
  .otp{gap:7px}
  .otp-box{height:56px;font-size:24px;border-radius:14px}
  .children{padding-left:20px}
  .slot>div>.composer{margin-left:0}
  .hint{display:none}
  .uploads{grid-template-columns:repeat(2,1fr)}
  .rules{grid-template-columns:1fr}
  .lightbox{padding:16px}
  .lightbox .lb-prev,.lightbox .lb-next{top:auto;bottom:12px;margin:0}
  .mock{left:auto;right:12px;bottom:12px}
  .mock-pop{left:auto;right:0;transform-origin:right bottom;width:min(320px,calc(100vw - 24px))}
  body[data-route="new"] .mock{bottom:88px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/** Sample illustration (SVG data URI) standing in for user photos. */
function art(seed, w = 800, h = 600) {
  const r = rng(seed), pal = Object.values(HEX), bg = pal[seed % pal.length];
  let shapes = '';
  for (let i = 0; i < 6; i++) {
    const c = pal[Math.floor(r() * pal.length)], x = r() * w, y = r() * h, s = 60 + r() * 220;
    shapes += r() > .5
      ? `<circle cx="${x | 0}" cy="${y | 0}" r="${s / 2 | 0}" fill="${c}"/>`
      : `<rect x="${x - s / 2 | 0}" y="${y - s / 2 | 0}" width="${s | 0}" height="${s * .8 | 0}" rx="${s / 4 | 0}" fill="${c}" transform="rotate(${(r() * 40 - 20) | 0} ${x | 0} ${y | 0})"/>`;
  }
  const sq = `<path d="M${w * .1} ${h * .8} c${w * .1} -${h * .25} ${w * .2} -${h * .25} ${w * .3} 0 s${w * .2} ${h * .25} ${w * .3} 0" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/>${shapes}${sq}<text x="24" y="${h - 24}" font-family="sans-serif" font-size="22" fill="#111" opacity=".55">รูปตัวอย่าง</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

  if (isList(r)) {
    const filter = { roomId: r.name === 'room' ? r.id : null, tag: r.name === 'tag' ? r.tag : null, q: r.name === 'search' ? r.q : null };
    const data = await net(() => ({ topics: api.topics(filter), rooms: api.rooms(), tags: api.tags() }));
    if (r.name === 'room' && !data.rooms.some(x => x.id === r.id)) throw { status: 404, what: 'room' };
    return { html: r.name === 'home' ? homeView(data) : listView(r, data), after: afterList, title: listTitle(r, data) };
  }
  switch (r.name) {
    case 'topic': {
      const data = await net(() => api.topic(r.id));
      state.lastTopicId = r.id;
      state.recent = [r.id, ...state.recent.filter(x => x !== r.id)].slice(0, 5);
      store.set('wb.recent', JSON.stringify(state.recent));
      return { html: topicView(data), after: () => afterTopic(data), title: data.topic.title, roomId: data.topic.roomId };
    }
    case 'user': {
      const u = USERS.find(x => x.username === r.username);
      await net(() => true);
      if (!u) throw { status: 404, what: 'user' };
      return { html: userView(u, r.tab), after: afterTabs, title: u.displayName };
    }
    case 'new': return { html: newTopicView(), after: afterNew, title: 'ตั้งกระทู้ใหม่' };
    case 'login': return { html: loginView(r), after: focusFirst, title: 'เข้าสู่ระบบ' };
    case 'twofa': return { html: twofaView(), after: afterTwofa, title: 'ยืนยันตัวตน 2 ขั้นตอน' };
    case 'signup': return { html: signupView(), after: focusFirst, title: 'สมัครสมาชิก' };
    case 'verify': return { html: verifyView(), after: afterVerify, title: 'ยืนยันอีเมล' };
    case 'signup-secure': return { html: secureView(), title: 'ยินดีต้อนรับ' };
    case 'forgot': return { html: forgotView(), after: focusFirst, title: 'ลืมรหัสผ่าน' };
    case 'forgot-sent': return { html: forgotSentView(r), title: 'ตรวจอีเมลของคุณ' };
    case 'reset': return { html: resetView(), after: focusFirst, title: 'ตั้งรหัสผ่านใหม่' };
    case 'settings-profile': return { html: settingsView('profile'), after: afterSettings, title: 'ตั้งค่าโปรไฟล์' };
    case 'settings-security': return { html: settingsView('security'), after: afterSettings, title: 'ความปลอดภัย' };
    case 'setup-2fa': state.setup = { step: 0, dir: 1 }; return { html: setupView(), after: afterSetup, title: 'ตั้งค่า 2FA' };
  }
  throw { status: 404 };
}

function updateChrome(r, out) {
  document.title = (out.title ? out.title + ' · ' : '') + 'เว็บบอร์ด';
  document.body.dataset.route = r.name;
  document.body.dataset.layout = AUTH_LAYOUT.includes(r.name) ? 'auth' : 'board';
  state.navRoom = out.roomId || null;
  renderTopActions();

  const q = $('#q');

  $('#searchForm').classList.toggle('has-value', !!q.value);
  $$('.mock-links a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === r.hash));
}

const lnav = $('#lnav');
const navOpen = { rooms: true, tags: true };
let navSig = '';
function syncNav() {
  const u = state.user, sig = [u?.id, u?.avatar?.length, TOPICS.length].join('|');
  if (sig !== navSig) { navSig = sig; renderNav(); }
  markNav();
}
function renderNav() {
  const u = state.user, rooms = api.rooms(), tags = api.tags().slice(0, 8);
  const sec = (key, title, items) => `<section class="nav-sec${navOpen[key] ? ' open' : ''}" data-sec="${key}">
      <button class="nav-h" type="button" data-action="nav-sec" aria-expanded="${navOpen[key]}">${title}${icon('i-down')}</button>
      <div class="nav-body"><div>${items}</div></div></section>`;
  lnav.innerHTML = `<nav aria-label="หลัก">
      <a class="nav-item" data-nav="home" href="#/">${icon('i-home')}หน้าแรก</a>
      <a class="nav-item" data-nav="new" href="#/new">${icon('i-plus')}ตั้งกระทู้</a>
      ${u ? `<a class="nav-item" data-nav="me" href="#/u/${u.username}">${avatar(u, 22)}โปรไฟล์ของฉัน</a>` : `<a class="nav-item" data-nav="login" href="#/login">${icon('i-lock')}เข้าสู่ระบบ</a>`}
    </nav>
    ${sec('rooms', 'ห้อง', rooms.map(r => `<a class="nav-item" data-nav="room-${r.id}" href="#/rooms/${r.id}">${rIc(r)}${esc(r.name)}<span class="n">${r.topicCount}</span></a>`).join(''))}
    ${sec('tags', 'แท็กยอดนิยม', tags.map(t => `<a class="nav-item" data-nav="tag-${esc(t.name)}" href="#/tags/${encodeURIComponent(t.name)}"><span class="hash">#</span>${esc(t.name)}<span class="n">${t.count}</span></a>`).join(''))}
    <p class="nav-foot">ไม่ต้องสมัครก็อ่านได้<br>ข้อมูลทั้งหมดเป็นข้อมูลตัวอย่าง</p>`;
}
function markNav() {
  const r = state.route;
  if (!r) return;
  let key = null;
  if (r.name === 'home' || r.name === 'search') key = 'home';
  else if (r.name === 'room') key = 'room-' + r.id;
  else if (r.name === 'topic' && state.navRoom) key = 'room-' + state.navRoom;
  else if (r.name === 'tag') key = 'tag-' + r.tag;
  else if (r.name === 'new') key = 'new';
  else if (r.name === 'user' && state.user?.username === r.username) key = 'me';
  else if (r.name === 'login') key = 'login';
  $$('.nav-item', lnav).forEach(a => a.classList.toggle('active', a.dataset.nav === key));
}
function setNav(open) {
  document.body.classList.toggle('nav-open', open);
  $('.nav-toggle').setAttribute('aria-expanded', open);
  if (open) setTimeout(() => $('.nav-item.active, .nav-item', lnav)?.focus({ preventScroll: true }), 120);
}
