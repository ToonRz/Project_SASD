function listTitle(r, d) {
  if (r.name === 'room') return d.rooms.find(x => x.id === r.id)?.name;
  if (r.name === 'tag') return '#' + r.tag;
  if (r.name === 'search') return `ค้นหา “${r.q}”`;
  return 'หน้าแรก';
}
const rIc = (room, size = '') => `<span class="r-ic ${size}" style="--rc:var(--c-${room.color})">${icon(room.icon)}</span>`;

function mediaHTML(images, key) {
  const n = images.length;
  return `<div class="p-media" data-n="${n}" data-i="0" style="--ci:0"><div class="p-track">${images.map((im, k) => `<button type="button" data-action="lightbox" data-gallery="${key}" data-index="${k}" aria-label="ดูรูป ${k + 1} จาก ${n}"><img src="${im.src}" alt="${esc(im.alt || '')}" loading="lazy"></button>`).join('')}</div>
    ${n > 1 ? `<button type="button" class="car-btn prev" data-action="car" data-d="-1" aria-label="รูปก่อนหน้า" disabled>${icon('i-left')}</button><button type="button" class="car-btn next" data-action="car" data-d="1" aria-label="รูปถัดไป">${icon('i-right')}</button><div class="dots">${images.map((_, k) => `<i class="${k ? '' : 'on'}"></i>`).join('')}</div><span class="car-count">1/${n}</span>` : ''}</div>`;
}
function setCarousel(m, i) {
  const n = +m.dataset.n;
  i = Math.max(0, Math.min(n - 1, i));
  m.dataset.i = i; m.style.setProperty('--ci', i);
  $$('.dots i', m).forEach((d, k) => d.classList.toggle('on', k === i));
  $('.prev', m).disabled = i === 0; $('.next', m).disabled = i === n - 1;
  $('.car-count', m).textContent = `${i + 1}/${n}`;
}

function cardHTML(t, i, { q = '', activeTag = '', preview = false, still = false } = {}) {
  const room = ROOMS.find(r => r.id === t.roomId);
  const author = userById(t.authorId) || state.user;
  const images = (t.images || []).filter(x => x.src);
  if (!preview) GALLERIES['t' + t.id] = images;
  const title = t.title ? highlight(t.title, q) : '<span class="placeholder">หัวข้อกระทู้</span>';
  const titleEl = preview ? `<span class="t-link">${title}</span>`
    : `<a class="t-link" href="#/topics/${t.id}"><span class="t-tt"${state.lastTopicId === t.id ? ' style="view-transition-name:topic-title"' : ''}>${title}</span></a>`;
  const roomEl = room
    ? (preview ? `<span class="p-room">${rIc(room)}${esc(room.name)}</span>` : `<a class="p-room" href="#/rooms/${room.id}">${rIc(room)}${esc(room.name)}</a>`)
    : `<span class="p-room"><span class="r-ic none">${icon('i-grid')}</span><span class="placeholder">ยังไม่เลือกห้อง</span></span>`;
  const by = author ? (preview ? `<span class="by">โดย ${esc(author.displayName)}</span>` : `<a class="by" href="#/u/${author.username}">โดย ${esc(author.displayName)}</a>`) : '';
  const meta = `<div class="p-meta">${roomEl}<span class="dot">•</span>${t.createdAt ? timeEl(t.createdAt) : '<span>เมื่อสักครู่</span>'}<span class="dot">•</span>${by}</div>`;
  const n = t.commentCount || 0;
  const li = inner => `<li class="${still || preview ? '' : 'rise'}" style="--i:${Math.min(i, 10)}">${inner}</li>`;
  if (state.compact && !preview) return li(`<article class="post compact" data-id="${t.id}">
      <div class="p-thumb">${images[0] ? `<img src="${images[0].src}" alt="" loading="lazy">` : rIc(room, 'lg')}</div>
      <div style="min-width:0">${meta}<h3 class="p-title">${titleEl}</h3></div>
      <a class="pill" href="#/topics/${t.id}" aria-label="${n} ความเห็น">${icon('i-chat')}${n}</a></article>`);
  const flair = t.tags.length ? `<div class="flair">${t.tags.map(x => preview ? `<span>#${esc(x)}</span>` : `<a class="${x === activeTag ? 'on' : ''}" href="#/tags/${encodeURIComponent(x)}">#${esc(x)}</a>`).join('')}</div>` : '';
  const excerpt = (t.body || '').replace(/\s+/g, ' ').trim();
  const body = images.length ? mediaHTML(images, preview ? 'preview' : 't' + t.id) : excerpt ? `<p class="p-ex">${esc(excerpt)}</p>` : '';
  const actions = preview
    ? `<div class="p-actions"><span class="pill">${icon('i-chat')}0 ความเห็น</span><span class="pill">${icon('i-share')}แชร์</span></div>`
    : `<div class="p-actions"><a class="pill" href="#/topics/${t.id}">${icon('i-chat')}${n} ความเห็น</a><button type="button" class="pill" data-action="share" data-href="#/topics/${t.id}">${icon('i-share')}แชร์</button></div>`;
  return li(`<article class="post" data-id="${t.id || 0}">${meta}<h3 class="p-title">${titleEl}</h3>${flair}${body}${actions}</article>`);
}

/* ---------- Topic detail ---------- */
const MAX_DEPTH = 2; // 0,1,2 = ซ้อน 3 ชั้น ลึกกว่านั้นเรียงต่อในชั้นที่ 3 พร้อม @ชื่อ
function buildTree(list) {
  const map = new Map(list.map(c => [c.id, { ...c, children: [] }]));
  const roots = [];
  for (const c of map.values()) (c.parentId && map.has(c.parentId) ? map.get(c.parentId).children : roots).push(c);
  return { roots, map };
}
const countDesc = c => c.children.reduce((n, k) => n + 1 + countDesc(k), 0);
function flatDesc(c) { const out = []; (function walk(n) { n.children.forEach(k => { out.push(k); walk(k); }); })(c); return out.sort(byOldest); }

function galleryHTML(images, key) {
  if (!images || !images.length) return '';
  const n = Math.min(images.length, 4);
  return `<div class="gallery g${n}">${images.slice(0, 4).map((im, i) => `<button type="button" data-action="lightbox" data-gallery="${key}" data-index="${i}" aria-label="ดูรูป ${i + 1} จาก ${images.length}: ${esc(im.alt || '')}"><img src="${im.src}" alt="${esc(im.alt || '')}" loading="lazy"></button>`).join('')}</div>`;
}

function commentHTML(c, depth, no, kidsHTML, desc, replyTo, topic, anim) {
  const u = userById(c.authorId);
  const collapsed = state.collapsed.has(c.id), fresh = state.freshId === c.id;
  const bodyHTML = c.body ? (replyTo ? paras(c.body).replace('<p>', `<p><span class="reply-to">@${esc(replyTo)}</span> `) : paras(c.body)) : (replyTo ? `<p><span class="reply-to">@${esc(replyTo)}</span></p>` : '');
  const inner = `<article class="comment${collapsed ? ' collapsed' : ''}${fresh ? ' fresh' : ''}" id="c-${c.id}" data-id="${c.id}" data-author="${esc(u.displayName)}">
    ${desc ? `<button class="thread-line" data-action="toggle-thread" aria-label="ย่อหรือขยายความเห็นย่อยของ ${esc(u.displayName)}" aria-expanded="${!collapsed}"></button>` : ''}
    <div class="c-main">
      <header class="c-top">${avatar(u, 32)}<a class="c-name" href="#/u/${u.username}">${esc(u.displayName)}</a>${u.id === topic.authorId ? '<span class="badge purple op">เจ้าของกระทู้</span>' : ''}<span class="muted">·</span>${timeEl(c.createdAt)}<span class="c-no">${depth === 0 ? 'ความเห็นที่ ' : ''}${no}</span></header>
      ${bodyHTML ? `<div class="c-body">${bodyHTML}</div>` : ''}
      ${c.image ? `<button class="c-img" type="button" data-action="lightbox" data-gallery="c${c.id}" data-index="0" aria-label="ดูรูปในความเห็น"><img src="${c.image.src}" alt="${esc(c.image.alt || '')}" loading="lazy"></button>` : ''}
      <div class="c-actions"><button class="link-btn" data-action="reply">ตอบกลับ</button>${desc ? `<button class="link-btn tog" data-action="toggle-thread"><span class="when-open">ซ่อนความเห็นย่อย</span><span class="when-closed">แสดง ${desc} ความเห็นย่อย</span></button>` : ''}</div>
    </div>
    <div class="slot"><div></div></div>
    ${kidsHTML ? `<div class="children-wrap"><div class="children">${kidsHTML}</div></div>` : ''}
  </article>`;
  if (fresh) return `<div class="grow">${inner}</div>`;
  return anim ? `<div class="rise" style="--i:${Math.min(anim.i++, 10)}">${inner}</div>` : inner;
}
function threadHTML(c, depth, no, map, topic, anim) {
  if (depth < MAX_DEPTH) {
    const kids = c.children.map((k, i) => threadHTML(k, depth + 1, `${no}-${i + 1}`, map, topic)).join('');
    return commentHTML(c, depth, no, kids, countDesc(c), null, topic, anim);
  }
  return commentHTML(c, depth, no, '', 0, null, topic) +
    flatDesc(c).map((k, i) => commentHTML(k, depth, `${no}-${i + 1}`, '', 0, userById(map.get(k.parentId)?.authorId)?.displayName, topic)).join('');
}
function commentsHTML(comments, topic, animate) {
  if (!comments.length) return `<div class="c-empty"><b>ยังไม่มีความเห็น</b>เริ่มบทสนทนาเป็นคนแรกได้ที่ช่องด้านล่าง</div>`;
  const { roots, map } = buildTree(comments);
  const anim = animate ? { i: 0 } : null;
  return roots.map((c, i) => threadHTML(c, 0, String(i + 1), map, topic, anim)).join('');
}

const otpHTML = label => `<div class="otp" data-otp role="group" aria-label="${label}">${Array.from({ length: 6 }, (_, i) => `<input class="otp-box" inputmode="numeric" pattern="[0-9]*" autocomplete="${i === 0 ? 'one-time-code' : 'off'}" aria-label="หลักที่ ${i + 1}">`).join('')}</div>`;

function qrSVG(seed) {
  const r = rng(seed), n = 25, cells = [];
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && r() > .52) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
  const f = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.6"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" rx="1.1" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".7"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" fill="#111" shape-rendering="crispEdges" role="img" aria-label="QR code สำหรับเพิ่มบัญชีในแอป (จำลอง)">${cells.join('')}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}</svg>`;
}

function openDialog(html, { onAction } = {}) {
  const dlg = $('#dlg');
  dlg.innerHTML = html;
  dlg.showModal();
  requestAnimationFrame(() => dlg.classList.add('show'));
  return new Promise(resolve => {
    const close = val => {
      dlg.classList.remove('show');
      setTimeout(() => dlg.close(), reduced() ? 0 : 240);
      dlg.removeEventListener('click', onClick); dlg.removeEventListener('cancel', onCancel); dlg.removeEventListener('submit', onSubmit);
      resolve(val);
    };
    const onClick = async e => {
      const b = e.target.closest('[data-dlg]');
      if (b) { if (onAction) { const v = await onAction(b.dataset.dlg, dlg); if (v !== false) close(v ?? b.dataset.dlg); } else close(b.dataset.dlg); }
      else if (e.target === dlg) close(null);
    };
    const onSubmit = async e => { e.preventDefault(); const v = onAction ? await onAction('ok', dlg) : 'ok'; if (v !== false) close(v ?? 'ok'); };
    const onCancel = e => { e.preventDefault(); close(null); };
    dlg.addEventListener('click', onClick); dlg.addEventListener('cancel', onCancel); dlg.addEventListener('submit', onSubmit);
    setTimeout(() => (dlg.querySelector('input,[data-autofocus]') || dlg.querySelector('[data-dlg]'))?.focus(), 40);
  });
}

const lb = { el: $('#lightbox'), list: [], i: 0, from: null };
function openLightbox(key, index, fromEl) {
  const list = GALLERIES[key] || [];
  if (!list.length) return;
  Object.assign(lb, { list, i: index, from: fromEl });
  const im = $('img', lb.el);
  im.src = list[index].src; im.alt = list[index].alt || '';
  lb.el.classList.remove('closing'); lb.el.classList.add('open');
  updateLbCount();
  const go = () => {
    const to = im.getBoundingClientRect(), fr = fromEl.getBoundingClientRect();
    if (!reduced() && to.width) {
      const s = fr.width / to.width;
      im.style.transition = 'none';
      im.style.transform = `translate(${fr.left + fr.width / 2 - (to.left + to.width / 2)}px,${fr.top + fr.height / 2 - (to.top + to.height / 2)}px) scale(${s})`;
      im.style.opacity = '.6';
      void im.offsetWidth;
      im.style.transition = ''; im.style.transform = ''; im.style.opacity = '';
    }
    $('.lb-close', lb.el).focus({ preventScroll: true });
  };
  im.complete ? go() : im.addEventListener('load', go, { once: true });
  document.documentElement.style.overflow = 'hidden';
}
function closeLightbox() {
  if (!lb.el.classList.contains('open')) return;
  const im = $('img', lb.el), fr = lb.from?.isConnected && lb.from.getBoundingClientRect(), to = im.getBoundingClientRect();
  if (fr && !reduced() && lb.i === +lb.from.dataset.index) {
    im.style.transform = `translate(${fr.left + fr.width / 2 - (to.left + to.width / 2)}px,${fr.top + fr.height / 2 - (to.top + to.height / 2)}px) scale(${fr.width / to.width})`;
  } else im.style.opacity = '0';
  lb.el.classList.add('closing');
  setTimeout(() => { lb.el.classList.remove('open', 'closing'); im.style.transform = ''; im.style.opacity = ''; lb.from?.focus?.({ preventScroll: true }); }, 380);
  document.documentElement.style.overflow = '';
}
function stepLightbox(d) {
  if (lb.list.length < 2) return;
  lb.i = (lb.i + d + lb.list.length) % lb.list.length;
  const im = $('img', lb.el);
  im.style.opacity = '0'; im.style.transform = `translateX(${d * 24}px)`;
  setTimeout(() => {
    im.src = lb.list[lb.i].src; im.alt = lb.list[lb.i].alt || '';
    im.style.transition = 'none'; im.style.transform = `translateX(${-d * 24}px)`; void im.offsetWidth;

}

/* ---------- Image uploads ---------- */
const ACCEPT = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
let upSeq = 1;
function checkFile(f) {
  if (!ACCEPT.includes(f.type)) return 'รองรับเฉพาะ JPG, PNG, WebP และ GIF';
  if (f.size > LIMITS.imageMB * 1024 * 1024) return `ไฟล์ใหญ่เกิน ${LIMITS.imageMB} MB (${(f.size / 1048576).toFixed(1)} MB)`;
  return null;
}
function simulateUpload(item, onTick, onDone) {
  item.status = 'uploading'; item.progress = 0;
  const failAt = state.mock.offline ? 55 + Math.random() * 20 : 101;
  const id = setInterval(() => {
    item.progress = Math.min(100, item.progress + 8 + Math.random() * 18);
    if (item.progress >= failAt) { clearInterval(id); item.status = 'error'; item.error = 'อัปโหลดไม่สำเร็จ'; onDone(); return; }
    if (item.progress >= 100) { clearInterval(id); item.status = 'done'; onDone(); return; }
    onTick();
  }, state.mock.slow ? 380 : 140);
}
function addTopicFiles(files) {
  const d = state.draft;
  if (!d) return;
  let room = LIMITS.images - d.images.filter(x => x.status !== 'error').length;
  if (room <= 0) return toast(`แนบรูปได้สูงสุด ${LIMITS.images} รูป`, 'err');
  [...files].forEach(f => {
    const err = checkFile(f);
    if (!err && room <= 0) return toast(`แนบได้อีกไม่เกิน ${LIMITS.images} รูป ข้ามไฟล์ที่เกิน`, 'err');
    const item = { id: upSeq++, name: f.name, size: f.size, src: err ? null : URL.createObjectURL(f), alt: f.name.replace(/\.[^.]+$/, ''), status: err ? 'error' : 'queued', error: err, progress: 0, file: f };
    d.images.push(item);
    if (!err) { room--; startTopicUpload(item); }
  });
  renderUploads(); updatePreview(); revalidateLive('Images');
}
function startTopicUpload(item) {
  simulateUpload(item, () => paintUpload(item), () => { paintUpload(item, true); updatePreview(); revalidateLive('Images'); });
}
function paintUpload(item, full) {
  const el = $(`[data-up="${item.id}"]`);
  if (!el) return;

  el.style.setProperty('--p', item.progress | 0);

function upHTML(it) {

  return `<div class="up ${it.status}" data-up="${it.id}" style="--p:${it.progress | 0}"><img src="${it.src}" alt="${esc(it.alt)}"><span class="bar"><i></i></span><span class="ok">${icon('i-check')}</span><button type="button" class="rm" data-action="up-remove" aria-label="เอารูป ${esc(it.name)} ออก">${icon('i-x')}</button></div>`;
}
function renderUploads() {

async function sampleFile(seed) {
  const svg = decodeURIComponent(art(seed).split(',')[1]);
  const image = new Image(); image.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  await image.decode();
  const c = document.createElement('canvas'); c.width = 800; c.height = 600;
  c.getContext('2d').drawImage(image, 0, 0, 800, 600);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return new File([blob], `sample-${seed}.png`, { type: 'image/png' });
}

  const btn = form.querySelector('[type=submit]');
  setBusy(btn, true, 'กำลังเข้าสู่ระบบ…');
  try {
    const res = await net(() => api.login(email, pw), 500);
    alertBox();
    const next = form.dataset.next || '#/';
    if (res.requires2fa) { state.pending2fa = { userId: res.userId, next, remember: form.remember.checked }; location.hash = '#/login/2fa'; return; }
    setSession(res.user, form.remember.checked);

    location.hash = next;
  } catch (e) {

    else if (e.status === 423) lockout(btn, e.until);
    else alertBox('err', 'เชื่อมต่อไม่ได้', 'ตรวจการเชื่อมต่อแล้วลองอีกครั้ง');

}
function lockout(btn, until) {
  const paint = () => {

    btn.disabled = true; btn.querySelector('.lbl').textContent = `ลองใหม่ใน 0:${String(s).padStart(2, '0')}`;
  };
  alertBox('err', 'พยายามเข้าสู่ระบบผิดหลายครั้ง', 'เพื่อความปลอดภัย ล็อกไว้ชั่วคราว 30 วินาที หรือ <a class="link" href="#/forgot">รีเซ็ตรหัสผ่าน</a>');

}

  if (e.key === '/' && !typing && document.body.dataset.layout !== 'auth') {
    e.preventDefault();
    if (matchMedia('(max-width:860px)').matches) $('#topbar').classList.add('search-open');
    $('#q').focus();
  }
});

function setViewMode(mode, toggle) {
  if ((mode === 'compact') === state.compact) return;
  state.compact = mode === 'compact'; store.set('wb.view', mode);
  toggle.dataset.mode = mode;
  $$('button', toggle).forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  const ul = $('#rows');
  if (!ul) return;
  const r = state.route;
  const render = () => { ul.innerHTML = state.feedItems.slice(0, state.visible).map((t, i) => cardHTML(t, i, { q: r.q, activeTag: r.tag, still: true })).join(''); };
  const name = () => $$('.post', ul).forEach(p => p.style.viewTransitionName = 'p' + p.dataset.id);
  if (!document.startViewTransition || reduced()) return render();
  // Each post morphs between card and compact; the page itself stays put.
  document.documentElement.classList.add('vt-local');
  name();
  const t = document.startViewTransition(() => { render(); name(); });
  t.ready.catch(() => {}); t.updateCallbackDone.catch(() => {});
  t.finished.catch(() => {}).finally(() => { document.documentElement.classList.remove('vt-local'); $$('.post', ul).forEach(p => p.style.viewTransitionName = ''); });
}

/* ---------- Avatar crop dialog ---------- */
async function openCropDialog(file) {
  const err = checkFile(file);
  if (err) { toast(err, 'err'); return null; }
  const url = URL.createObjectURL(file);
  const im = new Image(); im.src = url;
  try { await im.decode(); } catch { toast('เปิดรูปนี้ไม่ได้', 'err'); return null; }
  const R = 120, base = Math.max((R * 2) / im.naturalWidth, (R * 2) / im.naturalHeight);
  const cs = { z: 1, x: 0, y: 0 };
  const W = im.naturalWidth * base, H = im.naturalHeight * base;
  const clamp = () => { const w = W * cs.z / 2, h = H * cs.z / 2; cs.x = Math.max(R - w, Math.min(w - R, cs.x)); cs.y = Math.max(R - h, Math.min(h - R, cs.y)); };
  const paint = () => { const el = $('#cropStage img'); if (el) el.style.transform = `translate(${cs.x}px,${cs.y}px) scale(${cs.z})`; };
  const p = openDialog(`<h2>ครอปรูปโปรไฟล์</h2><p>ลากเพื่อเลื่อนตำแหน่ง ใช้แถบด้านล่างเพื่อซูม</p>
    <div class="crop-stage" id="cropStage"><img src="${url}" alt="" draggable="false" style="width:${W}px;height:${H}px;margin-left:${-W / 2}px;margin-top:${-H / 2}px"><span class="mask"></span></div>
    <div class="zoom-row">${icon('i-image')}<input type="range" min="1" max="3" step="0.01" value="1" id="cropZoom" aria-label="ซูม">${icon('i-zoom')}</div>
    <div class="dialog-actions"><button class="btn btn-ghost" data-dlg="cancel">ยกเลิก</button><button class="btn btn-primary" data-dlg="ok">ใช้รูปนี้</button></div>`, {
    onAction: k => {
      if (k !== 'ok') return null;
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const k2 = 256 / (R * 2), w = W * cs.z * k2, h = H * cs.z * k2;
      c.getContext('2d').drawImage(im, 128 - w / 2 + cs.x * k2, 128 - h / 2 + cs.y * k2, w, h);
      return c.toDataURL('image/jpeg', .9);
    },
  });
  const stage = $('#cropStage'), zoom = $('#cropZoom');
  let drag = null;
  stage.addEventListener('pointerdown', e => { drag = { x: e.clientX - cs.x, y: e.clientY - cs.y }; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (!drag) return; cs.x = e.clientX - drag.x; cs.y = e.clientY - drag.y; clamp(); paint(); });
  stage.addEventListener('pointerup', () => drag = null);
  stage.addEventListener('wheel', e => { e.preventDefault(); zoom.value = Math.max(1, Math.min(3, +zoom.value - e.deltaY * .002)); zoom.dispatchEvent(new Event('input')); }, { passive: false });
  zoom.addEventListener('input', () => { cs.z = +zoom.value; clamp(); paint(); });
  const out = await p;
  return out && out !== 'cancel' ? out : null;
}
